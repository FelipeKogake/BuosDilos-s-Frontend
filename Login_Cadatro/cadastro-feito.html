<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../api/temaPreload.js" data-paleta="login"></script>
    <script src="../api/acessibilidadeWidget.js" defer></script>
    <link rel="stylesheet" href="CSS/cadastro-feito.css">
    <link rel="stylesheet" href="CSS/auth-landmarks.css">
    <link rel="stylesheet" href="../CSS/acessibilidade.css">
    <link rel="stylesheet" href="../CSS/responsivo.css">
    <link id="favicon" rel="icon" type="image/png" href="../Tela_Inicia_Com_Login/Assets/logo-azul.png">
    <title>Cadastro Feito — Sistema</title>
</head>
<body>
    <header class="topo-auth">
        <a class="topo-auth-marca" href="../index.html">PopDreams</a>
    </header>

    <img src="Assets/cadastro-feito/estrelas-azul.png" class="estrelas estrelas--back" aria-hidden="true" alt="" loading="lazy" />

    <div class="personagem" aria-hidden="true">
        <img src="Assets/cadastro-feito/personagem-azul.png" alt="" class="personagemImg" loading="lazy" />
    </div>

    <main class="conteudo">
        <h1 class="titulo">Cadastro feito com sucesso</h1>
        <button type="button" class="btn-voltar" data-acao="voltar-para-login">Voltar para login</button>
    </main>

    <img src="Assets/cadastro-feito/estrelas-azul.png" class="estrelas estrelas--front" aria-hidden="true" alt="" loading="lazy" />

    <button class="btn-tema" data-acao="alternar-tema" aria-label="Trocar tema do site">
        <img src="Assets/avatar-azul.png" alt="" aria-hidden="true" loading="lazy" />
    </button>

    <script src="JS/cadastro-feito.js"></script>

    <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
    <div class="vw-plugin-top-wrapper"></div>
    </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>

    <footer class="rodape-auth">
        <p>&copy; 2026 PopDreams &middot; Escola Germinare Tech</p>
    </footer>

</body>
</html>
