<!DOCTYPE html>
<html lang="pt-BR"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../api/temaPreload.js" data-paleta="login"></script>
    <script src="../api/acessibilidadeWidget.js" defer></script>
    <link rel="stylesheet" href="CSS/recuperacao.css">
    <link rel="stylesheet" href="CSS/auth-landmarks.css">
    <link rel="stylesheet" href="../CSS/acessibilidade.css">
    <link rel="stylesheet" href="../CSS/responsivo.css">
    <link id="favicon" rel="icon" type="image/png" href="../Tela_Inicia_Com_Login/Assets/logo-azul.png">
    <title>Recuperação de Senha</title>
</head>
<body>
    <header class="topo-auth">
        <a class="topo-auth-marca" href="../index.html">PopDreams</a>
    </header>

    <!-- estrelas de fundo (atrás) -->
    <img src="Assets/recuperacao/estrelas-azul.png" class="estrelas estrelas--back" aria-hidden="true" loading="lazy" alt="" />

    <div class="personagem" aria-hidden="true">
        <div class="personagem-sombra"></div>
        <img src="Assets/recuperacao/personagem-recuperacao.png" alt="Personagem" class="personagemImg" loading="lazy" />
    </div>

    <main class="painel-recuperacao">
        <h1 class="titulo">Esqueceu a Senha?</h1>

        <p class="descricao">Digite seu email para enviarmos um código para sua recuperação de sua senha.</p>


        <form novalidate>
            <div class="campo">
                <label for="email">Email de recuperação</label>
                <input type="email" id="email" placeholder="Email" />
            </div>
        </form>

        <button class="btn-continuar" data-acao="tentar-continuar">Continuar</button>

        <a href="login.html" class="voltar">Voltar para Login</a>
    </main>

    <!-- estrelas da frente -->
    <img src="Assets/recuperacao/estrelas-azul.png" class="estrelas estrelas--front" aria-hidden="true" loading="lazy" alt="" />

    <button class="btn-tema" data-acao="alternar-tema">
        <img src="Assets/avatar-azul.png" alt="Trocar tema" loading="lazy" />
    </button>

    <script type="module" src="JS/recuperacao.js"></script>

    <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
    <div class="vw-plugin-top-wrapper"></div>
    </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>

    <footer class="rodape-auth">
        <p>&copy; 2026 PopDreams &middot; Escola Germinare Tech</p>
    </footer>

</body>
</html>
