<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../api/temaPreload.js" data-paleta="login"></script>
    <script src="../api/acessibilidadeWidget.js" defer></script>
    <link rel="stylesheet" href="CSS/nova-senha.css">
    <link rel="stylesheet" href="CSS/auth-landmarks.css">
    <link rel="stylesheet" href="../CSS/acessibilidade.css">
    <link rel="stylesheet" href="../CSS/responsivo.css">
    <link id="favicon" rel="icon" type="image/png" href="../Tela_Inicia_Com_Login/Assets/logo-azul.png">
    <title>Nova Senha — Sistema</title>
</head>
<body>
    <header class="topo-auth">
        <a class="topo-auth-marca" href="../index.html">PopDreams</a>
    </header>

    <img src="Assets/nova-senha/estrelas-azul.png" class="estrelas estrelas--back" aria-hidden="true" alt="" loading="lazy" />

    <div class="personagem" aria-hidden="true">
        <div class="personagem-sombra"></div>
        <img src="Assets/nova-senha/personagem-azul.png" alt="" class="personagemImg" loading="lazy" />
    </div>

    <main class="painel-nova-senha">
        <h1 class="titulo">Nova senha</h1>

        <form novalidate>
            <div class="campo">
            <label for="senha-nova">Senha Nova</label>
            <div class="input-wrapper">
                <input
                    type="password"
                    id="senha-nova"
                    name="senha-nova"
                    placeholder="Senha"
                    autocomplete="new-password"
                    aria-required="true"
                />
                <button type="button" class="btn-olho" data-acao="alternar-senha" data-campo="senha-nova" aria-label="Mostrar senha">
                    &#xf06e;
                </button>
            </div>
        </div>

        <div class="campo">
            <label for="confirma-senha">Confirmação de Senha</label>
            <div class="input-wrapper">
                <input
                    type="password"
                    id="confirma-senha"
                    name="confirma-senha"
                    placeholder="Confirma a senha"
                    autocomplete="new-password"
                    aria-required="true"
                />
                <button type="button" class="btn-olho" data-acao="alternar-senha" data-campo="confirma-senha" aria-label="Mostrar senha">
                    &#xf06e;
                </button>
            </div>
        </div>

            <button type="button" class="btn-alterar" data-acao="tentar-alterar">Alterar</button>
        </form>

        <a href="login.html" class="voltar">Voltar para Login</a>
    </main>

    <img src="Assets/nova-senha/estrelas-azul.png" class="estrelas estrelas--front" aria-hidden="true" alt="" loading="lazy" />

    <button class="btn-tema" data-acao="alternar-tema" aria-label="Trocar tema do site">
        <img src="Assets/nova-senha/avatar-azul.png" alt="" aria-hidden="true" loading="lazy" />
    </button>

    <script src="JS/nova-senha.js"></script>

    <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
    <div class="vw-plugin-top-wrapper"></div>
    </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>

    <footer class="rodape-auth">
        <p>&copy; 2026 PopDreams &middot; Escola Germinare Tech</p>
    </footer>

</body>
</html>
