<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../api/temaPreload.js" data-paleta="app"></script>
    <script src="../api/acessibilidadeWidget.js" defer></script>
    <link rel="stylesheet" href="CSS/tela_produto.css">
    <link id="favicon" rel="icon" type="image/png" href="../Tela_Inicia_Com_Login/Assets/logo-azul.png">
    <title>Produto</title>
</head>
<body>

    <!-- BARRA TOPO ESCURA -->
    <div class="top-bar"></div>

    <!-- NAVBAR -->
    <div class="navbar-wrapper">
        <header class="navbar">
            <a href="../index.html" class="navbar-logo">
                <img src="../Tela_Inicia_Com_Login/Assets/logo-azul.png" alt="Logo" class="navbar-logo-img" />
            </a>
            <nav class="navbar-links">
                <a href="../index.html" class="nav-link">TELA INICIAL</a>
                <a href="tela_catalogo.html" class="nav-link">BONECOS</a>
                <a href="tela_catalogo.html#itens" class="nav-link">ITENS</a>
            </nav>
            <div class="navbar-actions">
                <div class="busca-nav" id="busca-nav">
                    <input type="text" class="busca-nav-input" placeholder="Buscar..." />
                    <button class="icon-btn" aria-label="Buscar">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    </button>
                </div>
                <button class="icon-btn" aria-label="Notificações" onclick="exigirLogin()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                </button>
                <button class="icon-btn" aria-label="Favoritos" onclick="exigirLogin()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                </button>
                <button class="icon-btn" aria-label="Carrinho" onclick="exigirLogin()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                </button>
                <a href="../Login_Cadatro/login.html" class="btn-entrar-nav">ENTRAR</a>
            </div>
        </header>
    </div>

    <main id="conteudo-principal">

    <!-- HERO -->
    <section class="hero">
        <div class="hero-imagens">
            <button class="btn-voltar" onclick="history.back()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
                Voltar
            </button>
            <div class="produto-galeria">
                <img src="Assets/login/personagem-azul.png" alt="Personagem" class="hero-img hero-img-1" />
                <button class="hero-foto-seta hero-foto-seta--anterior" id="hero-foto-anterior" type="button" aria-label="Foto anterior" hidden>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
                </button>
                <button class="hero-foto-seta hero-foto-seta--proxima" id="hero-foto-proxima" type="button" aria-label="Próxima foto" hidden>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
                </button>
            </div>
        </div>
        <div class="hero-content">
            <p class="hero-subtitulo">&nbsp;</p>
            <h1 class="hero-titulo">Carregando produto...</h1>
            <div class="hero-preco-row">
                <span class="hero-preco"></span>
                <span class="hero-estrelas"></span>
            </div>
            <p class="hero-descricao"></p>
            <div class="hero-acoes-row">
                <button class="btn-comprar" onclick="exigirLogin()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                    COMPRAR
                </button>
                <button class="btn-favoritar-produto" id="btn-favoritar-produto" type="button" aria-pressed="false" aria-label="Favoritar">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                </button>
            </div>
        </div>
        <div class="hero-imagens">
            <div class="hero-img hero-img-1"></div>
            <img src="Assets/Subtract.jpg" alt="" class="hero-fundo-img" aria-hidden="true" />
        </div>
    </section>


    <!-- NOVOS BONECOS -->
    <section class="section-bonecos">
        <h2 class="section-titulo">Outros produtos</h2>
        <div class="bonecos-grid">
            <div class="estado-carregando">
                <div class="spinner" aria-hidden="true"></div>
                <p>Carregando produtos...</p>
            </div>
        </div>
    </section>

    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-inner">
            <div class="footer-brand">
                <p class="footer-name">PopDreams</p>

            </div>
            <div class="footer-cols">
                <div class="footer-col">
                    <p class="footer-col-title">PRODUTOS</p>
                    <a href="tela_catalogo.html">Bonecos</a>
                </div>
                <div class="footer-col">
                    <p class="footer-col-title">SUPORTE</p>
                    <a href="mailto:contato@exemplo.com">Suporte</a>
                </div>
                <div class="footer-col">
                    <p class="footer-col-title">COMPANHIA</p>
                    <a href="https://institutojef.org.br/">Sobre Germinare</a>
                </div>
            </div>
        </div>
        <div class="footer-bottom">
            <p>© 2026 PopDreams. Escola Germinare Tech.</p>
        </div>
    </footer>

    <!-- Botão tema -->
    <button class="btn-tema" onclick="toggleTema()">
        <img src="Assets/avatar-azul.png" alt="Trocar tema" />
    </button>

    <script type="module" src="JS/tela_produto.js"></script>

    <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
    <div class="vw-plugin-top-wrapper"></div>
    </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>
</body>
</html>
