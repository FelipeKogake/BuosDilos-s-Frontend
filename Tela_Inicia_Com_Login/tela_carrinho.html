<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../api/temaPreload.js" data-paleta="app"></script>
    <script src="../api/acessibilidadeWidget.js" defer></script>
    <link rel="stylesheet" href="CSS/tela_carrinho.css">
    <link rel="stylesheet" href="../CSS/estados.css">
    <link rel="stylesheet" href="../CSS/acessibilidade.css">
    <link id="favicon" rel="icon" type="image/png" href="Assets/logo-azul.png">
    <title>Seu Carrinho</title>
</head>
<body>

    <!-- BARRA TOPO ESCURA -->
    <div class="top-bar"></div>

    <main id="conteudo-principal">

    <!-- HERO -->
    <section class="hero">
        <div class="favoritos-container">

            <div class="favoritos-header">
                <button class="btn-voltar" data-acao="voltar">VOLTAR</button>
            </div>

            <h1 class="favoritos-titulo" style="margin-bottom: 1.5rem;">Seu Carrinho</h1>

            <div class="carrinho-grid">

                <!-- LISTA DE ITENS -->
                <div class="favoritos-lista" id="lista-carrinho">
                    <div class="estado-carregando">
                        <div class="spinner" aria-hidden="true"></div>
                        <p>Carregando carrinho...</p>
                    </div>
                </div>

                <!-- RESUMO -->
                <div class="resumo-card">
                    <h2 class="resumo-titulo">Resumo</h2>
                    <hr class="resumo-divisor" />
                    <div class="resumo-linha">
                        <span>Subtotal:</span>
                        <span id="subtotal">R$ 0,00</span>
                    </div>
                    <div class="resumo-linha">
                        <span>Frete:</span>
                        <span id="frete">R$ 0,00</span>
                    </div>
                    <div class="resumo-linha">
                        <span>Desconto:</span>
                        <span id="desconto">R$ 0,00</span>
                    </div>
                    <form class="cupom-form" id="form-cupom" novalidate>
                        <label class="cupom-label" for="cupom-input">Cupom de desconto</label>
                        <div class="cupom-wrap">
                            <input class="cupom-input" type="text" id="cupom-input"
                                   placeholder="Ex.: GERMINARE10" autocomplete="off"
                                   aria-describedby="cupom-feedback" />
                            <button class="btn-adicionar" type="submit">Aplicar</button>
                        </div>
                        <p class="cupom-feedback" id="cupom-feedback" role="status"></p>
                    </form>
                    <hr class="resumo-divisor" />
                    <div class="resumo-total">
                        <span>Total:</span>
                        <span id="total">R$ 0,00</span>
                    </div>
                    <button class="btn-fechar-pedido" id="btn-fechar-pedido" type="button" disabled>
                        Fechar Pedido
                    </button>
                </div>

            </div>
        </div>
    </section>

    <!-- NOVOS BONECOS -->
    <section class="section-bonecos">
        <h2 class="section-titulo">Outros bonecos</h2>
        <div class="bonecos-grid">
            <div class="estado-carregando">
                <div class="spinner" aria-hidden="true"></div>
                <p>Carregando bonecos...</p>
            </div>
        </div>
    </section>

    </main>

    <!-- A confirmação do pedido agora acontece em tela_checkout.html, depois do
         formulário de entrega e pagamento. -->

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-inner">
            <div class="footer-brand">
                <p class="footer-name">PopDreams</p>
            </div>
            <div class="footer-cols">
                <div class="footer-col">
                    <p class="footer-col-title">PRODUTOS</p>
                    <a href="tela_catalogo.html">Bonecos</a>
                </div>
                <div class="footer-col">
                    <p class="footer-col-title">SUPORTE</p>
                    <a href="mailto:contato@exemplo.com">Suporte</a>
                </div>
                <div class="footer-col">
                    <p class="footer-col-title">COMPANHIA</p>
                    <a href="https://institutojef.org.br/">Sobre Germinare</a>
                </div>
            </div>
        </div>
        <div class="footer-bottom">
            <p>© 2026 PopDreams. Escola Germinare Tech.</p>
        </div>
    </footer>

    <!-- Botão tema -->
    <button class="btn-tema" data-acao="alternar-tema">
        <img src="Assets/avatar-azul.png" alt="Trocar tema" loading="lazy" />
    </button>

    <script type="module" src="JS/tela_carrinho.js"></script>
    <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
    <div class="vw-plugin-top-wrapper"></div>
    </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>

</body>
</html>
